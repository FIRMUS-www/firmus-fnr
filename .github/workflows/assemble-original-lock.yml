name: Assemble exact original FNR lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assemble-original-lock.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact original package-lock.json
        run: |
          cat \
            .import/package-lock.part00 \
            .import/package-lock.part01 \
            .import/package-lock.part02 \
            .import/package-lock.part03 \
            .import/package-lock.part04 \
            .import/package-lock.part05 \
            .import/package-lock.part06 \
            .import/package-lock.part07 \
            .import/package-lock.part08 \
            .import/package-lock.part09 \
            .import/package-lock.part10 \
            .import/package-lock.part11 \
            > package-lock.json
          echo "ff9b2ba3fe6ecca4d7522b14669cac7a35b44252588aedee1d16105c748e5f15  package-lock.json" | sha256sum -c -
      - name: Commit exact lockfile and clean import staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -r .import .github/workflows/assemble-original-lock.yml
          git commit -m "Restore exact original FNR package lock"
          git push
