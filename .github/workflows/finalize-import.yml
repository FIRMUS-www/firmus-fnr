name: Finalize original FNR import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-import.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recreate lockfile from original manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/finalize-import.yml
          git commit -m "Add package lock for original FNR concept"
          git push
